<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ALUMNIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container glass reg-container">
    <div class="auth-header">
      <div class="logo-icon center">AQ</div>
      <h2>Join the Network</h2>
      <p>Create your Alumiq account today.</p>
    </div>
    
    <div id="regAlert" class="alert d-none"></div>

    <form id="regForm" class="auth-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="regPhone" placeholder="+91 XXXXX XXXXX">
        </div>
        <div class="form-group">
          <label>College</label>
          <input type="text" id="regCollege" placeholder="IIT Delhi">
        </div>
        <div class="form-group">
          <label>Branch</label>
          <input type="text" id="regBranch" placeholder="Computer Science">
        </div>
        <div class="form-group">
          <label>Graduation Year</label>
          <input type="text" id="regYear" placeholder="2024">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="regRole">
            <option value="student">Student</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-1">Register Account</button>
    </form>
    
    <p class="auth-footer">Already have an account? <a href="login.html">Log In</a></p>
  </div>
  
  <script>
    // INLINE REGISTRATION HANDLER — cannot be cached, guaranteed to work
    (function() {
      var API_URL = "http://localhost:5000/api";

      document.addEventListener("DOMContentLoaded", function() {
        var regForm = document.getElementById("regForm");
        if (!regForm) return;

        regForm.addEventListener("submit", function(e) {
          e.preventDefault();
          var alertDiv = document.getElementById("regAlert");

          var payload = {
            name: document.getElementById("regName").value,
            email: document.getElementById("regEmail").value,
            phone: document.getElementById("regPhone").value,
            college: document.getElementById("regCollege").value,
            branch: document.getElementById("regBranch").value,
            year: document.getElementById("regYear").value,
            role: document.getElementById("regRole").value,
            password: document.getElementById("regPassword").value
          };

          fetch(API_URL + "/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          })
          .then(function(res) {
            return res.json().then(function(data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function(result) {
            if (result.ok) {
              // Save user to localStorage
              localStorage.setItem("alumiq_user", JSON.stringify(result.data.user));
              // Navigate to dashboard with user data in hash (bulletproof)
              var userHash = encodeURIComponent(JSON.stringify(result.data.user));
              window.location.replace("dashboard.html#userdata=" + userHash);
            } else {
              alertDiv.textContent = result.data.message;
              alertDiv.className = "alert error";
            }
          })
          .catch(function(err) {
            alertDiv.textContent = "Server error. Is the backend running on port 5000?";
            alertDiv.className = "alert error";
          });
        });
      });
    })();
  </script>
</body>
</html>
