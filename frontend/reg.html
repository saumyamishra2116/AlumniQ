<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ALUMNIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container glass reg-container">
    <div class="auth-header">
      <div class="logo-icon center">AQ</div>
      <h2>Join the Network</h2>
      <p>Create your Alumiq account today.</p>
    </div>
    
    <div id="regAlert" class="alert d-none"></div>

    <form id="regForm" class="auth-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="regPhone" placeholder="+91 XXXXX XXXXX">
        </div>
        <div class="form-group">
          <label>College</label>
          <input type="text" id="regCollege" placeholder="IIT Delhi">
        </div>
        <div class="form-group">
          <label>Branch</label>
          <input type="text" id="regBranch" placeholder="Computer Science">
        </div>
        <div class="form-group">
          <label>Graduation Year</label>
          <input type="text" id="regYear" placeholder="2024">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="regRole">
            <option value="student">Student</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-1">Register Account</button>
    </form>
    
    <p class="auth-footer">Already have an account? <a href="login.html">Log In</a></p>
  </div>
  
  
<script>
  const API_URL = "https://alumniq-btu5.onrender.com";

  document.getElementById("regForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const alertDiv = document.getElementById("regAlert");
    const submitButton = this.querySelector('button[type="submit"]');

    const payload = {
      name: document.getElementById("regName").value.trim(),
      email: document.getElementById("regEmail").value.trim(),
      phone: document.getElementById("regPhone").value.trim(),
      college: document.getElementById("regCollege").value.trim(),
      branch: document.getElementById("regBranch").value.trim(),
      year: document.getElementById("regYear").value.trim(),
      role: document.getElementById("regRole").value,
      password: document.getElementById("regPassword").value
    };

    alertDiv.textContent = "Registering your account...";
    alertDiv.className = "alert";
    submitButton.disabled = true;

    try {
      const response = await fetch(`${API_URL}/api/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || "Registration failed.");
      }

      alertDiv.textContent = data.message || "Registration successful!";
      alertDiv.className = "alert";

      if (data.user) {
        localStorage.setItem("alumiq_user", JSON.stringify(data.user));
      }

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);

    } catch (error) {
      console.error("Registration error:", error);
      alertDiv.textContent =
        error.message === "Failed to fetch"
          ? "Could not connect to the server. Please try again."
          : error.message;
      alertDiv.className = "alert error";
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
