<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ALUMNIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container glass">
    <div class="auth-header">
      <div class="logo-icon center">AQ</div>
      <h2>Welcome Back</h2>
      <p>Log in to access your Alumiq dashboard.</p>
    </div>
    
    <div id="loginError" class="alert error d-none"></div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@college.edu">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
    
    <p class="auth-footer">Don't have an account? <a href="reg.html">Create one</a></p>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
